<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NRC Workspace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#7b8498;--line:#e8ebf2;--blue:#5267e8;--purple:#8b5cf6;--cyan:#22b8cf;--green:#168653;--amber:#b77916}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:238px;background:white;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;gap:10px;align-items:center;padding:0 9px 25px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--purple),var(--cyan));display:grid;place-items:center;color:white;font-weight:900}.brand b{font-size:16px}.brand small{display:block;font-size:9px;letter-spacing:1.3px;color:var(--muted);margin-top:3px}.label{font-size:10px;color:#a0a7b7;letter-spacing:1.2px;font-weight:700;padding:13px 11px 7px}.nav button{width:100%;border:0;background:none;color:#667086;padding:11px;border-radius:10px;text-align:left;cursor:pointer;font:600 13px inherit;margin:2px 0}.nav button.active,.nav button:hover{background:#eef1ff;color:var(--blue)}.profile{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#e8eaff;display:grid;place-items:center;color:#4d55bd;font-weight:800}small.muted,.muted{color:var(--muted)}main{padding:25px 32px;max-width:1500px;width:100%;margin:auto;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px;color:var(--muted);font-size:12px}.topright{display:flex;gap:10px;align-items:center}.iconbtn,.select,.search,input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;color:#4f5b73;font:inherit}.iconbtn{cursor:pointer}.welcome h1{margin:0 0 5px;font-size:25px;letter-spacing:-.6px}.welcome p{margin:0 0 22px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}.toolbar h2,h2{font-size:19px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:4px}.btn{background:var(--blue);color:white;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.alt{background:white;color:#536079;border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#bb4545;border:1px solid #f4dada;box-shadow:none}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 7px 25px #1c274c0a}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.statnum{font-size:25px;font-weight:800;margin:15px 0 4px}.sectiongrid{display:grid;grid-template-columns:1.5fr 1fr;gap:15px;margin-top:16px}.chart{height:165px;margin-top:12px}.chart svg{width:100%;height:100%}.donutwrap{display:flex;align-items:center;gap:20px;padding:20px 8px}.donut{width:125px;height:125px;border-radius:50%;background:conic-gradient(var(--blue) 0 81%,var(--cyan) 81%);position:relative;flex-shrink:0}.donut:after{content:"";position:absolute;inset:18px;background:white;border-radius:50%}.legend{font-size:12px;line-height:2;color:var(--muted)}.perfgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.perf{background:#f8f9fd;border:1px solid #eef0f6;border-radius:11px;padding:13px}.perf b{display:block;font-size:20px;margin:7px 0}.perf span{font-size:11px;color:var(--muted)}.tablecard{margin-top:16px;padding:0;overflow:hidden}.tablehead{display:flex;justify-content:space-between;align-items:center;padding:17px 19px;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#9aa2b2;font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:12px 15px;background:#fcfcfe}td{padding:13px 15px;border-top:1px solid #f0f1f5;font-size:12px}tr:hover td{background:#fafbff}.link{color:var(--blue);font-weight:750;cursor:pointer}.pill{border-radius:20px;padding:5px 9px;font-size:10px;font-weight:750}.paid{background:#e7f7ef;color:var(--green)}.pending{background:#fff4df;color:var(--amber)}.page{display:none}.page.active{display:block}.tablewrap{overflow:auto}.empty{text-align:center;padding:45px;color:var(--muted)}.modalbg{display:none;position:fixed;inset:0;background:#18203970;z-index:5;align-items:center;justify-content:center;padding:16px}.modal{background:white;border-radius:17px;padding:22px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #1113}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{font-size:19px}.x{border:0;background:#f1f3f8;border-radius:8px;padding:7px 10px;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{background:#f0f5ff;border:1px solid #dfe8ff;border-radius:10px;padding:11px;color:#4e5c83;font-size:11px;margin-top:13px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#f7f8fc;padding:12px;border-radius:9px}.detail small{display:block;color:var(--muted);margin-bottom:5px}.detail b{font-size:13px}.rowline{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.pagepad{padding:18px}
@media(max-width:900px){.side{width:205px}main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.sectiongrid{grid-template-columns:1fr}}
@media(max-width:620px){.app{display:block}.side{width:100%;padding:12px;border:0;border-bottom:1px solid var(--line)}.brand{padding-bottom:10px}.nav{display:flex;overflow:auto;gap:4px}.label,.profile{display:none}.nav button{white-space:nowrap;width:auto;padding:9px}.nav button span{display:none}main{padding:17px 12px}.grid{gap:8px}.card{padding:13px}.statnum{font-size:21px}.perfgrid{grid-template-columns:repeat(2,1fr)}.sectiongrid{gap:10px}.welcome h1{font-size:21px}.tablecard{overflow:auto}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}

#login{position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;padding:30px;background:radial-gradient(circle at 20% 20%,#14504f,transparent 45%),radial-gradient(circle at 85% 80%,#0f3b44,transparent 50%),#06161a}
.lcard{display:flex;width:min(920px,100%);min-height:480px;background:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 80px #0008}
.lleft{flex:1;border-radius:30px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:radial-gradient(circle at 30% 30%,#1f6f6a 0,transparent 55%),radial-gradient(circle at 80% 90%,#2a8c88 0,transparent 40%),#0a1f24}
.llogo{font-weight:800;letter-spacing:.5px}.ltxt h2{font-size:50px;line-height:1.15;margin:0 0 10px;letter-spacing:-.5px}.ltxt p{margin:0;font-size:50px;color:#cde4e2;max-width:300px}
.lright{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 50px;gap:14px}.lright h1{margin:0;font-size:24px;letter-spacing:-.3px}.pw{position:relative}.pw input{width:100%;padding-right:56px}.pw span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:#0b4a52;cursor:pointer;font-weight:700}.lbtn{background:#0b4a52;padding:12px}
@media(max-width:700px){.lleft{display:none}.lright{padding:24px 18px}}
.hide{display:none!important}#printArea{display:none}.ph{display:flex;justify-content:space-between;border-bottom:2px solid #000;margin-bottom:14px;padding-bottom:10px}.ph h1{margin:0 0 4px;font-size:20px}.pt{border:1px solid #999;margin:10px 0}.pt th,.pt td{border:1px solid #999;padding:6px 8px;color:#000;background:#fff;font-size:12px;white-space:normal}.itr{display:grid;grid-template-columns:3fr 1fr 1.3fr auto;gap:6px;margin-bottom:6px}
@media print{body>:not(#printArea){display:none!important}#printArea{display:block;padding:20px;color:#000;font:13px sans-serif}}
</style></head><body>
<div id="login" style="display:flex"><div class="lcard"><div class="lleft"><div class="llogo">Welcome to NRC Workspace</div><div class="ltxt"><h2>SERVICE ORDERS,<br>ALL IN ONE PLACE.</h2><p>Sign in to create SOs, track payments and follow up with customers.</p></div></div><form id="lf" class="lright"><h1>WELCOME BACK</h1><p class="sub" style="margin:0">Welcome back! Please enter your details.</p><div class="field"><label>Email</label><input name="e" type="email" placeholder="Enter your email" required></div><div class="field"><label>Password</label><div class="pw"><input name="p" type="password" placeholder="Enter your password" required><span onclick="const i=this.previousElementSibling;i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'Show':'Hide'">Show</span></div></div><button class="btn lbtn">Sign in</button><div id="lerr" class="sub" style="color:#bb4545"></div></form></div></div>
<div class="app hide" id="app"><aside class="side"><div class="brand"><div class="logo">N</div><div><b>NRC Workspace</b><small>SERVICE ORDERS</small></div></div><nav class="nav">
<button data-p="dashboard" onclick="nav('dashboard')">Dashboard</button><button data-p="so" onclick="nav('so')">SO Records</button><button data-p="customers" onclick="nav('customers')">Customers</button><div class="label">ADMIN</div><button class="a" data-p="archive" onclick="nav('archive')">Archive</button><button class="a" data-p="activity" onclick="nav('activity')">Activity History</button><button class="a" data-p="users" onclick="nav('users')">Users</button></nav>
<div class="profile"><div class="avatar">●</div><div><b id="who"></b><small class="muted" style="display:block" id="role"></small><a class="link" onclick="sb.auth.signOut().then(boot)">Sign out</a></div></div></aside><main><div id="view"></div></main></div>
<div class="modalbg" id="modal"><div class="modal"><div class="modalhead"><h2 id="mt"></h2><button class="x" onclick="cm()">✕</button></div><div id="mc"></div></div></div>
<div id="printArea"></div>
<script>
// ===== EDIT THESE =====
const SB_URL='https://cskbcnrolxumwejfrczc.supabase.co',SB_KEY='sb_publishable_M3QE1rbcF2vp5yhX7_GqGg_EjCza92o';
const CO={name:'NRC electric Fence Sdn Bhd',addr:'Lot 2578, Block 10, KCLD 1st Floor, 3rd Miles, Jalan Rock, Central Park Commercial Centre, 93250 Kuching, Sarawak',tel:'Tel: 082-236886'};
// ======================
const sb=supabase.createClient(SB_URL,SB_KEY);
let me,SO=[],CU=[],PR=[],LG=[],pg='dashboard',mon=new Date().toISOString().slice(0,7),q='',st='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const isAdmin=()=>me?.role==='admin',cn=id=>CU.find(c=>c.id===id)?.name||'—',sum=l=>l.reduce((t,s)=>t+Number(s.total),0),today=()=>new Date().toISOString().slice(0,10);
const cm=()=>$('#modal').style.display='none',om=()=>$('#modal').style.display='flex',logA=t=>sb.from('activity_log').insert({user_name:me.name,action:t});
$('#lf').onsubmit=async e=>{e.preventDefault();const f=e.target,{error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});if(error)$('#lerr').textContent=error.message;else boot()};
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$('#login').style.display='flex';$('#app').classList.add('hide');return}
$('#login').style.display='none';$('#app').classList.remove('hide');
const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=data||{id:session.user.id,name:session.user.email,role:'staff'};
$('#who').textContent=me.name;$('#role').textContent=isAdmin()?'Admin':'Staff';document.querySelectorAll('.nav .a,.nav .label').forEach(b=>b.classList.toggle('hide',!isAdmin()));nav(pg)}
async function nav(p){const [a,b,c,d]=await Promise.all([sb.from('service_orders').select('*').order('so_date',{ascending:false}).order('so_no',{ascending:false}),sb.from('customers').select('*').order('name'),sb.from('profiles').select('*').order('name'),isAdmin()?sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(200):{data:[]}]);SO=a.data||[];CU=b.data||[];PR=c.data||[];LG=d.data||[];go(p)}
function go(p,f){pg=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));$('#view').innerHTML=V[p]();if(f){const i=$('#q');i.focus();i.setSelectionRange(1e4,1e4)}else scrollTo(0,0)}
const th=a=>`<div class="tablewrap"><table><thead><tr>${a.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>`,te='</tbody></table></div>';
const pill=s=>`<span class="pill ${s==='Paid'?'paid':'pending'}">${s}</span>`;
const V={
dashboard(){const a=SO.filter(s=>!s.archived),m=a.filter(s=>s.so_date.startsWith(mon)),p=m.filter(s=>s.status==='Pending'),out=a.filter(s=>s.status==='Pending'),owe=CU.map(c=>({c,l:out.filter(s=>s.customer_id===c.id)})).filter(x=>x.l.length).sort((x,y)=>sum(y.l)-sum(x.l));
return `<div class="toolbar"><div><h2>Dashboard</h2><div class="sub">Overview for the selected month</div></div><input type="month" value="${mon}" onchange="mon=this.value;go('dashboard')"></div><div class="grid">${[['Total SO',m.length],['Pending payment',p.length],['Paid SO',m.length-p.length],['Total amount',rm(sum(m))]].map(([k,v])=>`<div class="card"><div class="stathead">${k}</div><div class="statnum">${v}</div></div>`).join('')}</div>
<div class="card" style="margin-top:16px"><b>Unpaid SO (all months)</b><div class="sub">${out.length} SO · ${rm(sum(out))} to collect</div>${owe.map(x=>`<div class="rowline"><span class="link" onclick="stmt('${x.c.id}')">${esc(x.c.name)}</span><b>${x.l.length} SO · ${rm(sum(x.l))}</b></div>`).join('')||'<div class="empty">No unpaid SO.</div>'}</div>`},
so(){const l=SO.filter(s=>!s.archived&&(!st||s.status===st)&&(s.so_no+cn(s.customer_id)+(s.worker||'')).toLowerCase().includes(q.toLowerCase()));
return `<div class="toolbar"><div><h2>SO Records</h2><div class="sub">${l.length} records · ${rm(sum(l))}</div></div><div><button class="btn alt" onclick="csv()">Export CSV</button> <button class="btn" onclick="sof()">＋ Create SO</button></div></div><div class="card"><div class="toolbar"><input id="q" placeholder="Search SO, customer or worker" value="${esc(q)}" oninput="q=this.value;go('so',1)"><select onchange="st=this.value;go('so')"><option value="">All status</option><option ${st==='Pending'?'selected':''}>Pending</option><option ${st==='Paid'?'selected':''}>Paid</option></select></div>${th(['SO No.','Customer','Date','Worker','Salesperson','Amount','Status','Actions'])}${l.map(s=>`<tr><td><b>${esc(s.so_no)}</b></td><td>${esc(cn(s.customer_id))}</td><td>${s.so_date}</td><td>${esc(s.worker||'')}</td><td>${esc(s.salesperson||'')}</td><td><b>${rm(s.total)}</b></td><td>${pill(s.status)}</td><td><button class="iconbtn" onclick="sof('${s.id}')">Edit</button> <button class="iconbtn" onclick="pso('${s.id}')">Print</button>${s.status==='Pending'?` <button class="iconbtn" onclick="paid('${s.id}')">Mark paid</button>`:''}${isAdmin()?` <button class="iconbtn" onclick="arch('${s.id}')">Archive</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8 class="empty">No SO found.</td></tr>'}${te}</div>`},
customers(){const out=SO.filter(s=>!s.archived&&s.status==='Pending');
return `<div class="toolbar"><div><h2>Customers</h2><div class="sub">Outstanding balance per customer</div></div><button class="btn" onclick="cf()">＋ Add customer</button></div><div class="card">${th(['Customer','Phone','Unpaid SO','Outstanding','Actions'])}${CU.map(c=>({c,l:out.filter(s=>s.customer_id===c.id)})).sort((x,y)=>sum(y.l)-sum(x.l)).map(({c,l})=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'')}</td><td>${l.length}</td><td><b>${rm(sum(l))}</b></td><td><button class="iconbtn" onclick="stmt('${c.id}')">Statement</button> <button class="iconbtn" onclick="cf('${c.id}')">Edit</button></td></tr>`).join('')}${te}</div>`},
archive(){return `<h2>Archive</h2><div class="card tablecard">${th(['SO No.','Customer','Amount','Reason','Action'])}${SO.filter(s=>s.archived).map(s=>`<tr><td>${esc(s.so_no)}</td><td>${esc(cn(s.customer_id))}</td><td>${rm(s.total)}</td><td>${esc(s.archive_reason||'')}</td><td><button class="btn alt" onclick="upd('${s.id}',{archived:false},'Restored ${esc(s.so_no)}')">Restore</button></td></tr>`).join('')||'<tr><td colspan=5 class="empty">No archived SO.</td></tr>'}${te}</div>`},
activity(){return `<h2>Activity History</h2><div class="card">${LG.map(x=>`<div class="rowline"><span>${esc(x.action)}</span><span class="muted">${esc(x.user_name)} · ${new Date(x.created_at).toLocaleString('en-GB')}</span></div>`).join('')||'<div class="empty">No activity yet.</div>'}</div>`},
users(){return `<h2>Users</h2><p class="sub">Add new staff in Supabase → Authentication → Users → Add user. They appear here after their first sign-in is created.</p><div class="card">${PR.map(p=>`<div class="rowline"><span><b>${esc(p.name)}</b> <span class="muted">${esc(p.email||'')}</span></span><span><select onchange="sb.from('profiles').update({role:this.value}).eq('id','${p.id}').then(()=>nav('users'))"><option ${p.role==='staff'?'selected':''}>staff</option><option ${p.role==='admin'?'selected':''}>admin</option></select> <button class="iconbtn" onclick="ren('${p.id}','${esc(p.name)}')">Rename</button></span></div>`).join('')}</div>`}};
async function upd(id,o,t){const {error}=await sb.from('service_orders').update(o).eq('id',id);if(error)return alert(error.message);logA(t);nav(pg)}
const paid=id=>{const inv=prompt('Invoice number:');if(inv)upd(id,{status:'Paid',invoice_no:inv,payment_date:today()},'Marked SO paid · '+inv)};
const arch=id=>{const r=prompt('Archive reason:');if(r)upd(id,{archived:true,archive_reason:r},'Archived SO · '+r)};
const ren=(id,n)=>{const v=prompt('Display name:',n);if(v)sb.from('profiles').update({name:v}).eq('id',id).then(()=>nav('users'))};
async function cf(id){const c=CU.find(x=>x.id===id)||{},name=prompt('Customer name:',c.name||'');if(!name)return;const o={name,phone:prompt('Phone (with country code, e.g. 60123456789):',c.phone||'')||'',address:prompt('Address:',c.address||'')||''};const {error}=id?await sb.from('customers').update(o).eq('id',id):await sb.from('customers').insert(o);if(error)return alert(error.message);logA((id?'Updated':'Added')+' customer '+name);nav(pg)}
const itRow=i=>`<div class="itr"><input class="d" placeholder="Description" value="${esc(i.d)}"><input class="q" type="number" min="0" step="any" value="${i.q}"><input class="p" type="number" min="0" step=".01" placeholder="Price" value="${i.p}"><button type="button" class="x" onclick="this.parentNode.remove();tot()">✕</button></div>`;
const rd=()=>[...document.querySelectorAll('#its>.itr')].map(r=>({d:r.querySelector('.d').value,q:+r.querySelector('.q').value,p:+r.querySelector('.p').value})).filter(i=>i.d||i.p);
const tot=()=>$('#tt').textContent='Total '+rm(rd().reduce((t,i)=>t+i.q*i.p,0));
const nextNo=()=>'SOL-'+String(SO.reduce((m,s)=>Math.max(m,+(s.so_no.match(/(\d+)$/)||[])[1]||0),0)+1).padStart(4,'0');
function sof(id){const r=SO.find(s=>s.id===id)||{},it=r.items?.length?r.items:[{d:'',q:1,p:''}],dl=(n,a)=>`<datalist id="${n}">${a.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
$('#mt').textContent=id?'Edit '+r.so_no:'Create SO';
$('#mc').innerHTML=`<form id="sf"><div class="formgrid">
<div class="field"><label>SO Number</label><input name="so_no" value="${esc(r.so_no||nextNo())}" ${id?'readonly':''} required></div>
<div class="field"><label>SO Date</label><input name="so_date" type="date" value="${r.so_date||today()}" required></div>
<div class="field"><label>Customer</label><input name="cust" list="cl" value="${esc(id?cn(r.customer_id):'')}" required>${dl('cl',CU.map(c=>c.name))}</div>
<div class="field"><label>Worker (handled by)</label><input name="worker" list="wl" value="${esc(r.worker||'')}">${dl('wl',[...new Set(SO.map(s=>s.worker).filter(Boolean))])}</div>
<div class="field"><label>Salesperson</label><input name="salesperson" list="pl" value="${esc(r.salesperson||me.name)}">${dl('pl',PR.map(p=>p.name))}</div>
<div class="field"><label>Payment status</label><select name="status"><option>Pending</option><option ${r.status==='Paid'?'selected':''}>Paid</option></select></div>
<div class="field"><label>Invoice No.</label><input name="invoice_no" value="${esc(r.invoice_no||'')}"></div>
<div class="field"><label>Payment date</label><input name="payment_date" type="date" value="${r.payment_date||''}"></div>
<div class="field full"><label>Items (description · qty · unit price)</label><div id="its" oninput="tot()">${it.map(itRow).join('')}</div><div><button type="button" class="btn alt" onclick="$('#its').insertAdjacentHTML('beforeend',itRow({d:'',q:1,p:''}))">＋ Add item</button> <b id="tt" style="float:right"></b></div></div>
<div class="field full"><label>Remarks</label><textarea name="remarks" rows="2">${esc(r.remarks||'')}</textarea></div></div><div class="actions"><button type="button" class="btn alt" onclick="cm()">Cancel</button><button class="btn">Save SO</button></div></form>`;tot();
$('#sf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),items=rd();
if(f.status==='Paid'&&(!f.invoice_no||!f.payment_date))return alert('For Paid status, enter Invoice No. and Payment date.');
let c=CU.find(x=>x.name.toLowerCase()===f.cust.trim().toLowerCase());

const row={so_no:f.so_no,so_date:f.so_date,customer_id:c.id,worker:f.worker,salesperson:f.salesperson,status:f.status,invoice_no:f.invoice_no,payment_date:f.payment_date||null,remarks:f.remarks,items,total:items.reduce((t,i)=>t+i.q*i.p,0)};
const {error}=id?await sb.from('service_orders').update(row).eq('id',id):await sb.from('service_orders').insert({...row,created_by:me.id});

const pr=h=>{$('#printArea').innerHTML=h;print()};
const hd=t=>`<div class="ph"><div><h1>${esc(CO.name)}</h1>${esc(CO.addr)}<br>${esc(CO.tel)}</div><div style="text-align:right"><h1>${t}</h1>Date: ${new Date().toLocaleDateString('en-GB')}</div></div>`;
const bill=c=>`<p><b>Bill to:</b> ${esc(c.name)}<br>${esc(c.address||'')}<br>${esc(c.phone||'')}</p>`;
function pso(id){const s=SO.find(x=>x.id===id),c=CU.find(x=>x.id===s.customer_id)||{};
pr(hd('SERVICE ORDER / BILL')+bill(c)+`<p>SO No: <b>${esc(s.so_no)}</b> · SO date: ${s.so_date}${s.invoice_no?' · Invoice: '+esc(s.invoice_no):''}<br>Handled by: ${esc(s.worker||'-')} · Salesperson: ${esc(s.salesperson||'-')}</p><table class="pt"><tr><th>#</th><th>Description</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr>${s.items.map((i,n)=>`<tr><td>${n+1}</td><td>${esc(i.d)}</td><td>${i.q}</td><td>${rm(i.p)}</td><td>${rm(i.q*i.p)}</td></tr>`).join('')}<tr><td colspan=4 align=right><b>TOTAL</b></td><td><b>${rm(s.total)}</b></td></tr></table><p>Payment status: <b>${s.status.toUpperCase()}</b>${s.payment_date?' ('+s.payment_date+')':''}</p><p>${esc(s.remarks||'')}</p>`)}
const unpaid=id=>SO.filter(s=>!s.archived&&s.status==='Pending'&&s.customer_id===id).sort((a,b)=>a.so_date.localeCompare(b.so_date));
function stmt(id){const c=CU.find(x=>x.id===id),l=unpaid(id);$('#mt').textContent='Statement · '+c.name;
$('#mc').innerHTML=`<div class="sub">${l.length} unpaid SO · outstanding <b>${rm(sum(l))}</b></div>${th(['SO No.','Date','Remarks','Amount'])}${l.map(s=>`<tr><td>${esc(s.so_no)}</td><td>${s.so_date}</td><td>${esc(s.remarks||'')}</td><td>${rm(s.total)}</td></tr>`).join('')||'<tr><td colspan=4 class="empty">No unpaid SO.</td></tr>'}${te}<div class="actions"><button class="btn alt" onclick="rem('${id}')">Copy reminder text</button><button class="btn" onclick="cm();pst('${id}')">Print statement</button></div>`;om()}
function pst(id){const c=CU.find(x=>x.id===id),l=unpaid(id);pr(hd('STATEMENT OF ACCOUNT')+bill(c)+`<table class="pt"><tr><th>SO No.</th><th>Date</th><th>Remarks</th><th>Amount</th></tr>${l.map(s=>`<tr><td>${esc(s.so_no)}</td><td>${s.so_date}</td><td>${esc(s.remarks||'')}</td><td>${rm(s.total)}</td></tr>`).join('')}<tr><td colspan=3 align=right><b>TOTAL OUTSTANDING</b></td><td><b>${rm(sum(l))}</b></td></tr></table><p>Kindly settle the outstanding balance at your earliest convenience. Thank you.</p>`)}
function rem(id){const c=CU.find(x=>x.id===id),l=unpaid(id),t=`Dear ${c.name},\n\nFriendly reminder: the following service orders are still unpaid.\n${l.map(s=>`- ${s.so_no} (${s.so_date}): ${rm(s.total)}`).join('\n')}\n\nTotal outstanding: ${rm(sum(l))}\nKindly arrange payment. Thank you.\n${CO.name}`;navigator.clipboard.writeText(t).then(()=>alert('Reminder copied. Paste it into WhatsApp / email.'))}
function csv(){const rows=[['SO No','Customer','Date','Worker','Salesperson','Items','Amount','Status','Invoice No','Payment Date','Remarks'],...SO.filter(s=>!s.archived).map(s=>[s.so_no,cn(s.customer_id),s.so_date,s.worker,s.salesperson,s.items.map(i=>i.d+' x'+i.q).join('; '),s.total,s.status,s.invoice_no,s.payment_date,s.remarks])];
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='SO-Records-'+today()+'.csv';a.click()}
boot();
