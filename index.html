const LK=(()=>{try{return JSON.parse(localStorage.getItem('look'))||{}}catch(e){return{}}})();
function look(k,v){LK[k]=v;try{localStorage.setItem('look',JSON.stringify(LK))}catch(e){}applyLook()}
function applyLook(){const r=document.documentElement.style;r.setProperty('--ga',LK.ga??.55);r.setProperty('--dim',LK.dim??.5);$('#rga').value=(LK.ga??.55)*100;$('#rdim').value=(LK.dim??.5)*100}
applyLook();
async function del(id){const s=SO.find(x=>x.id===id);if(!isAdmin()||!s.archived)return;
if(prompt('This cannot be undone.\nType the SO number ('+s.so_no+') to delete it permanently:')!==s.so_no)return;
const {data,error}=await sb.from('service_orders').delete().eq('id',id).select();
if(error)return alert(error.message);
if(!data.length)return alert('Delete was not allowed. Please run the delete-permission SQL in Supabase first.');
logA('Permanently deleted '+s.so_no);nav('archive')}
boot();
